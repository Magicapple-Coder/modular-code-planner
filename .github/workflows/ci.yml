name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Check the scanner compiles
        run: python -m py_compile scripts/check_file_sizes.py

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Scan this repository with its own scanner
        run: python scripts/check_file_sizes.py . --lang en
